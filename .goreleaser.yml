version: 2

project_name: amflow

before:
  hooks:
  - make frontend

builds:
- ldflags:
  - -s -w -X github.com/artefactual-labs/amflow/internal/version.version={{.Version}}
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  goarch:
  - amd64
  flags:
  - -trimpath

checksum:
  name_template: "{{ .ProjectName }}-checksums.txt"

dockers_v2:
- dockerfile: Dockerfile.release
  sbom: "false"
  platforms:
  - linux/amd64
  images:
  - artefactual/amflow
  - ghcr.io/artefactual-labs/amflow/amflow
  tags:
  - latest
  - "v{{ .Major }}"
  - "{{ .Tag }}"
  labels:
    org.opencontainers.image.title: "{{.ProjectName}}"
    org.opencontainers.image.vendor: Artefactual Systems Inc.
    org.opencontainers.image.description: "amflow {{.Tag}}"
    org.opencontainers.image.url: https://github.com/artefactual-labs/amflow
    org.opencontainers.image.documentation: https://github.com/artefactual-labs/amflow/blob/main/README.md
    org.opencontainers.image.source: https://github.com/artefactual-labs/amflow
    org.opencontainers.image.licenses: Apache-2.0
    org.opencontainers.image.version: "{{.Version}}"
    org.opencontainers.image.revision: "{{.FullCommit}}"
    org.opencontainers.image.created: "{{.Date}}"
