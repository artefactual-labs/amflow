name: GoReleaser
on:
  push:
    tags:
      - 'v*'
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # GoReleaser publishes release archives.
      packages: write # GoReleaser publishes container images to GHCR.
    steps:
    - name: Check out code
      uses: actions/checkout@v7.0.1
      with:
        show-progress: false
        fetch-depth: 0
        persist-credentials: false
    - name: Install Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Install Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: '24.22.1'
        package-manager-cache: false
    - name: Log in to Docker Hub
      uses: docker/login-action@v4.7.0
      with:
        # Tagged releases use the existing Docker Hub repository credentials.
        username: ${{ secrets.DOCKER_USERNAME }} # jactionlint ignore=secrets-outside-env
        password: ${{ secrets.DOCKER_PASSWORD }} # jactionlint ignore=secrets-outside-env
    - name: Log in to the GitHub Container Registry
      uses: docker/login-action@v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v7.3.0
      with:
        distribution: goreleaser
        version: v2.19.0
        args: release --clean
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
